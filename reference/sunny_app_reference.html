              }}>{data.limitState === 'up' ? '漲停' : '跌停'}</span>
                  </span> : <>
                  <span style={{
                fontSize: 22,
                fontWeight: 900,
                color: data.change >= 0 ? '#ff5a5a' : '#33cc77'
              }}>
                    {data.price.toFixed(data.price < 50 ? 2 : 1)}
                  </span>
                  <span style={{
                fontSize: 13,
                fontWeight: 700,
                color: data.change >= 0 ? '#ff5a5a' : '#33cc77'
              }}>
                    {data.change >= 0 ? '+' : ''}{data.change} ({data.change >= 0 ? '+' : ''}{data.changePct}%)
                  </span>
                </>}
              </div>
            </div>

            {data.lowLiquidity || data.isDRStock ? (<div style={{
          margin: '16px 0',
          padding: '20px 18px',
          borderRadius: 12,
          background: 'rgba(200, 60, 60, 0.15)',
          border: '1px solid rgba(230, 100, 100, 0.5)',
          textAlign: 'center'
        }}>
                <div style={{
            fontSize: 14,
            fontWeight: 800,
            color: '#f0b8b8',
            lineHeight: 1.7
          }}>
                  {data.isDRStock ? '⚠ 此為 DR 股（存託憑證）' : '⚠ 此股票之流通性風險較高'}
                </div>
                <div style={{
            fontSize: 12,
            color: 'rgba(255,255,255,0.7)',
            lineHeight: 1.7,
            marginTop: 6
          }}>
                  本系統不予分析，亦不建議介入
                </div>
                <div style={{
            fontSize: 10.5,
            color: 'rgba(255,255,255,0.45)',
            lineHeight: 1.6,
            marginTop: 8
          }}>
                  {data.isDRStock ? '（DR股為海外母股的存託憑證，歷史價格還原方式特殊，均線數據難以驗證）' : `（${data.isTw ? '均量小於 1,000 張門檻' : '流通量偏低'}；多殺多時，低量股可能會賣不掉）`}
                </div>
              </div>) : <div style={{
          margin: '16px 0'
        }}>
                <WaterGauge data={data} holdings={[]} onMsg={setTopMsgData} />
              </div>}

            {}
          </>}

        {}


        <div style={{
        marginTop: 12,
        padding: '12px 14px',
        background: 'rgba(255,255,255,0.03)',
        borderRadius: 12,
        fontSize: 11,
        color: '#8a96ad',
        lineHeight: 1.8
      }}>
          <div style={{
          fontWeight: 700,
          color: '#aab4c8',
          marginBottom: 4
        }}>水位計怎麼看</div>
          浮球 = 現價。上方紅區是壓力、下方綠區是支撐。<br />
          浮球往上接近壓力 → 變綠＋亮燈，提醒可分批停利，越接近閃越快。<br />
          浮球往下接近支撐 → 變紅＋亮燈，提醒可分批買進，越接近閃越快。<br />
          壓力/支撐後的數字越大，代表那條線的能量越強（越難突破或支撐越穩）。
        </div>

      </div>
    </div>;
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
